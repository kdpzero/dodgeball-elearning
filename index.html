:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1b2236; --muted:#5d667c; --line:#e1e5ee;
  --accent:#e4572e; --accent-ink:#ffffff; --navy:#1f2a44;
  --ok:#1f9d63; --ok-bg:#e6f6ee; --bad:#d23b3b; --bad-bg:#fdeaea;
  --t-white:#e8ecf4; --t-white-ink:#2a3550;
  --t-yellow:#fff3bf; --t-yellow-ink:#5c4700;
  --t-orange:#ffe0c2; --t-orange-ink:#7a3a00;
  --t-red:#ffd6d6; --t-red-ink:#8a1111;
  --t-blue:#d6e6ff; --t-blue-ink:#10407a;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10141f; --card:#1a2133; --ink:#e8ebf5; --muted:#9aa4bd; --line:#2a3350;
    --accent:#ff7a52; --accent-ink:#1a0b05; --navy:#0b0f19;
    --ok:#4cd18d; --ok-bg:#12301f; --bad:#ff7d7d; --bad-bg:#3a1717;
    --t-white:#2a3350; --t-white-ink:#dfe5f5;
    --t-yellow:#4a3d0a; --t-yellow-ink:#ffe793;
    --t-orange:#4d2a0c; --t-orange-ink:#ffc999;
    --t-red:#4d1414; --t-red-ink:#ffb3b3;
    --t-blue:#0f2c52; --t-blue-ink:#b3d2ff;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "AtkH",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.015em;word-spacing:.04em}
button,input,select,textarea{font-family:inherit;letter-spacing:inherit}
header.top{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
header.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
header.top a{color:#fff;text-decoration:none;font-weight:700;letter-spacing:.2px}
header.top .sp{flex:1}
header.top .nav a{font-weight:600;font-size:14px;opacity:.95;margin-left:12px;white-space:nowrap}
header.top .brand{white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;line-height:1.2;margin:6px 0 4px}
h2{font-size:20px;margin:26px 0 10px}
h3{font-size:17px;margin:0 0 4px}
p{margin:6px 0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.chap{display:block;text-decoration:none;color:inherit;transition:transform .12s ease,border-color .12s}
.chap:hover{transform:translateY(-2px);border-color:var(--accent)}
.chap .num{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.chap .ico{font-size:26px;float:right;margin-left:8px}
.chap .rules{font-size:13px;color:var(--muted);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--t-white);color:var(--t-white-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--t-yellow);color:var(--t-yellow-ink)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb347);width:0}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;padding:11px 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.resetbtn{background:transparent;color:#b3261e;border:2px solid #b3261e;padding:11px 18px}
.btn.resetbtn:hover{background:#b3261e;color:#fff}
@media (prefers-color-scheme:dark){.btn.resetbtn{color:#ff8a80;border-color:#ff8a80}.btn.resetbtn:hover{background:#b3261e;color:#fff;border-color:#b3261e}}
#app:focus,#app:focus-visible{outline:none}
.lb{width:100%;border-collapse:collapse;font-size:16px}
.lb th,.lb td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.lb th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding-top:6px;padding-bottom:6px}
.lb .n{width:1%;white-space:nowrap;font-weight:700}
.lb .s{white-space:nowrap;color:var(--muted)}
.lb .p{white-space:nowrap;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.lb .nm{overflow-wrap:anywhere}
.lb .who{display:block;font-weight:700}
.lb .dt{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.lb tr.me td{background:rgba(232,87,42,.16)}
@media (max-width:420px){.lb{font-size:15px}.lb th,.lb td{padding:11px 5px}.lb .s{font-size:14px}}
.tbl tr.me td{background:rgba(232,87,42,.16);font-weight:700}
.btn[disabled]{cursor:not-allowed}
.btn.danger{background:#b3261e;color:#fff;padding:8px 14px}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 10px}
.btn.menu{display:block;width:100%;text-align:center;font-size:18px;padding:16px 20px;margin-top:10px;background:var(--card);color:var(--ink);border:2px solid var(--accent)}
.actbar{display:grid;gap:10px;margin-top:24px;padding:14px}
.actbar .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.abtn{appearance:none;font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;line-height:1.25}
.abtn:hover{filter:brightness(1.04);border-color:var(--accent)}
.abtn.pri{background:var(--accent);color:var(--accent-ink);border:0;min-height:60px;font-size:17px}
.abtn.dis{opacity:.5;cursor:default;pointer-events:none}
.abtn.on{border-color:#2e9e5b}
@media (max-width:340px){.actbar .g2{grid-template-columns:1fr}}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero{display:grid;gap:10px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;margin-right:6px;white-space:nowrap}
.tag.white{background:var(--t-white);color:var(--t-white-ink)}
.tag.yellow{background:var(--t-yellow);color:var(--t-yellow-ink)}
.tag.orange{background:var(--t-orange);color:var(--t-orange-ink)}
.tag.red{background:var(--t-red);color:var(--t-red-ink)}
.tag.blue{background:var(--t-blue);color:var(--t-blue-ink)}
.ref{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:1px 8px;border-radius:8px;margin-right:6px;white-space:nowrap}
.pt{margin:10px 0}
.lst{margin:6px 0 2px;padding-left:20px}.lst li{margin:5px 0}.pt p,.note p{margin:4px 0}
.devbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0;background:#fff8e1;border-color:#e0b400}.devbar span{flex:1;min-width:200px;font-size:14px;color:#3d2e00}.devbar span b{color:#3d2e00}
.pt h3 .ref{vertical-align:2px}
.note{border-left:5px solid var(--line);margin:10px 0;padding:10px 12px;border-radius:0 12px 12px 0;background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.note.white{border-left-color:#8a98b8}.note.yellow{border-left-color:#e0b400}.note.orange{border-left-color:#f08a1c}.note.red{border-left-color:#d62d2d}.note.blue{border-left-color:#3b82f6}
.note .hd{margin-bottom:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.fbtn{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:4px 11px;border-radius:99px}
.fbtn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){.fbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}}
.legend{display:grid;gap:6px;margin:8px 0}
.legend div{font-size:14px}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;cursor:pointer;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin:12px 0;padding:12px 14px;border-radius:12px}
.fb.good{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.q{font-size:19px;font-weight:650;line-height:1.4}
.score{font-size:46px;font-weight:800;line-height:1}
.miss{margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td,.tbl th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tbl td:last-child{font-weight:700;overflow-wrap:anywhere}
.tbl td:first-child{width:34%;overflow-wrap:anywhere}
.foot{margin-top:36px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.crumbs{font-size:14px}
.crumbs{margin-bottom:12px}
.crumbs a{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;padding:9px 16px;border-radius:12px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.crumbs a:hover{filter:brightness(1.08)}
.sr{position:absolute;left:-9999px}
.res{margin:8px 0;padding:10px 12px}
.res a{color:var(--accent);font-weight:700;text-decoration:none}
.tbl a{color:var(--accent);text-decoration:none;font-weight:600}.tbl a:hover{text-decoration:underline}
@media (max-width:520px){h1{font-size:22px}.q{font-size:17px}header.top .nav a{margin-left:8px;font-size:13px}}
@media (max-width:520px){
body{overflow-wrap:break-word}
.tbl{font-size:14px}.tbl td,.tbl th{padding:7px 6px}.tbl td:last-child{white-space:normal;overflow-wrap:anywhere}
header.top{padding:10px 12px}header.top .in{gap:8px}
header.top .nav a{padding:8px 4px;margin-left:4px}
.btn{padding:13px 16px}.opt{min-height:48px}
.row .btn{flex:1 1 auto;text-align:center}
}
@media (max-width:340px){.updbtn .ul{display:none}.updbtn{padding:6px 8px}}
@media (max-width:420px){.updbtn{padding:6px 7px;margin-left:5px;font-size:12px;gap:3px}}
@media (max-width:380px){header.top .brand{font-size:15px}header.top .nav a{font-size:12px;margin-left:2px;padding:8px 3px}.q{font-size:16px}h1{font-size:20px}}
@media (max-width:560px){header.top .bt{display:none}}
header.top .nav{display:flex;align-items:center}
.updbtn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);color:#fff;font:inherit;font-weight:700;font-size:13px;line-height:1;padding:7px 10px;margin-left:10px;border-radius:12px;cursor:pointer;white-space:nowrap}
.updbtn:hover{background:rgba(255,255,255,.24)}
.updbtn.has{background:#e8572a;border-color:#fff;animation:updp 1.6s ease-in-out infinite}
@keyframes updp{0%,100%{box-shadow:0 0 0 0 rgba(232,87,42,.7)}50%{box-shadow:0 0 0 7px rgba(232,87,42,0)}}
@media (prefers-reduced-motion:reduce){.updbtn.has{animation:none}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(92vw,520px);background:#1f2a44;color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px;box-shadow:0 4px 18px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-align:center}
#toast.show{opacity:1}
@media print{header.top,.btn,.filters,.search{display:none!important}body{background:#fff;color:#000}.card,.note{box-shadow:none}}

.timer{display:flex;align-items:center;gap:4px;font-weight:700;margin:2px 0 12px;flex-wrap:wrap}
.timer .tsec{min-width:1.4em;text-align:right;font-variant-numeric:tabular-nums}
.timer .tbar{flex:1 1 100%;height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:2px}
.timer .tbar i{display:block;height:100%;background:var(--ok);width:100%}
.timer .tbar i.low{background:#e8a317}
.timer .tbar i.crit{background:var(--bad)}
.chap.locked{opacity:.6}
.chap.locked:hover{transform:none;border-color:var(--line)}
</style>
</head>

  {ref:"6", h:"Mez", t:"Azonos színű és kialakítású mez (a szabás és hossz eltérhet). Egyedi szám <b>0–99</b> elöl és hátul (a hátsó a mez felső részén). A csapatkapitánynak, a vezetőknek és a játékvezetőknek jól azonosíthatónak kell lenniük, hogy ne lehessen őket játékossal összetéveszteni. A labdaszedő ne viseljen a csapatéhoz hasonló mezt."},
  {ref:"7.1–7.3", h:"Fejfedő, gipsz, kesztyű", t:"Fejfedő: csak <b>fejpánt és védősisak</b> (vallási fejfedő megengedett, ha nem veszélyes). Protézis viselhető; kemény felületű gipszet/ortézist <b>be kell párnázni</b>. Kesztyű csak orvosi szükség esetén, ezt a játékosnak igazolnia kell, és nem javíthatja a teljesítményt."},
  {ref:"7.4–7.7", h:"Ékszer, szemüveg, cipő, egyéb", t:"Veszélyesnek ítélt ékszert le kell venni; amit nem lehet, azt <b>leragasztva</b> és jóváhagyással lehet viselni. Szemüveg/védőszemüveg fejpánttal rögzítve (egyébként csak jóváhagyással). Cipő viselése kötelező: vászon, bőr vagy hasonló anyagú, <b>nem koszoló gumitalpú</b>. Más felszerelés csak a fő játékvezetők jóváhagyásával. Dobást/elkapást segítő anyag tilos, kivéve a kereskedelmi <b>száraz vagy folyékony magnéziát (chalk)</b>. Az orvosi célú anyagot kötéssel le kell fedni."}
 ],
 edf:[
  {tag:"white", ref:"Rule 4.1", t:"A névsorban szerepelhet olyan játékos is, aki a mérkőzés elején nincs jelen; megérkezése és a felszerelés ellenőrzése után csatlakozhat a cserezónához. A névsor a mérkőzés megkezdése után <b>nem szerkeszthető</b>."},
  {tag:"red", ref:"Rule 4.2", t:"<b>Felülírja a WDBF szabályt:</b> egy csapat 6-nál kevesebb aktív játékossal is kezdhet szettet. Ehhez a kapitánynak vagy csapatvezetőnek a „Line up” felszólítás előtt jeleznie kell a létszámot. Aki sérülés, hiányzás vagy piros lap miatt kényszerül kevesebb játékosra, nem köteles jelezni."},
  {tag:"white", ref:"Rule 4.2", t:"Ha a csapat véletlenül a kelleténél kevesebb játékossal kezd, a játékvezetők azonnal utasítják a sorba állításra; ha nem teszik, <b>sárga lap</b>. Ha a kelleténél többel kezd, azonnal <b>csapat sárga lap</b> jár. Mindkét esetben a csapat nem számít késznek (időhúzásnak minősülhet)."},
  {tag:"blue", ref:"Rule 4.2", t:"<b>Vegyes mérkőzés:</b> a „6 aktív játékos” helyett „3 aktív játékos nemenként”. Nemenként kevesebbel is lehet kezdeni, ha előre jelzik."},
  {tag:"yellow", ref:"Rule 4.2", t:"A távozó és a belépő játékos tartózkodhat a szabad területen, mert úton van a sorhoz vagy a pályára."},
  {tag:"yellow", ref:"Rule 4.3", t:"A szabály nem vonatkozik a labdaszedőként kijelölt, nem aktív játékosokra."},
  {tag:"orange", ref:"Rule 4.3", t:"Ha nem aktív játékos elhagyja a kijelölt területét: ha nem zavarja a játékot, a labdákat vagy a játékvezetőket, nincs következménye. Egyébként figyelmeztetés, majd kék lap. Ha zavarást okoz, azonnal büntetés (kék/sárga, hatástól függően)."},
  {tag:"yellow", ref:"Rule 4.4", t:"A 3 labdaszedős korlát a szett kezdetén és közben is érvényes. Háromnál több labdaszedő esetén először figyelmeztetés adható, utána <b>csapat sárga lap</b> jár."},
  {tag:"white", ref:"Rule 4.6–4.7", t:"Ha a labdaszedő túllép a középvonalon, a 31.10 és a 31.11 szabály szerint kell eljárni. Ha a labdaszedő indok nélkül hosszan elhagyja a játékterületet, a visszatérésekor figyelmeztetni kell, ismétlésnél a csapatot cserére lehet kötelezni."},
  {tag:"white", ref:"Rule 5.1", t:"Kettőnél több csapatvezető: a mérkőzés előtt figyelmeztetés, és a kezdésig meg kell oldani, különben azonnal <b>csapat sárga lap</b>. Ha szett között merül fel, a szett végén figyelmeztetnek, és a következő szett kezdetéig meg kell oldani. Ha utána sem oldják meg, újabb csapat sárga (ami piros lapnak számít)."},
  {tag:"orange", ref:"Rule 5.2", t:"A csapatvezető kijelölt területről való kilépése: ha nem zavar, nincs következménye. Egyébként figyelmeztetés, majd csapat sárga lap. Zavarás esetén azonnal csapat sárga."},
  {tag:"white", ref:"Rule 5.3", t:"Ha csapatvezető a játék felfüggesztése közben lép a pályára: figyelmeztetés, ismétléskor csapat sárga. Ha játék közben, akkor csapat sárga lap (kivéve, ha reklamációt kér és nem zavarja a játékot)."},
  {tag:"yellow", ref:"Rule 5.3–5.4", t:"Szettek között és a félidei szünetben a csapatvezető kiléphet a kijelölt területéről és beléphet a pályára. A csapatvezetőnek kijelölt játékos szettek között is csapatvezetőnek számít, ha jól azonosítható viseletet hord."},
  {tag:"yellow", ref:"Rule 6.1", t:"A rövidnadrág, nadrág és leggings keveréke a csapaton belül megengedett."},
  {tag:"white", ref:"Rule 6.1–6.2", t:"Az érvénytelen mezű játékost ki kell küldeni a mez rendezéséhez, a csapat pedig eggyel kevesebb aktív játékossal fejezi be a szettet. Ha két játékosnak azonos a száma, mérkőzés előtt csak az egyik maradhat; amíg mindketten a keretben vannak, egyikük sem lehet aktív a szett kezdetén."},
  {tag:"white", ref:"Rule 6.3 / 6.5", t:"A nem azonosítható kapitány vagy csapatvezető elveszíti a jogkörét (a játékvezetők megszólítása, időkérés, reklamáció). Azonosításhoz jelölés a mezen vagy karszalag kell."},
  {tag:"white", ref:"Rule 7", t:"Tiltott eszköz: ha előnyt ad, csalás miatt lap jár (sárga, ha a játék előtt derül ki, egyébként piros). Ha nem ad előnyt, el kell távolítani, aktív játékosnál a csapat eggyel kevesebbel fejezi be a szettet. Ha veszélyes eszköz miatt fájdalmat vagy sérülést okozó érintkezés történik, legalább sárga lap jár. Ha valaki a már betiltott eszközt újra viseli: veszélyes vagy előnyt adó esetén piros, egyébként sárga lap."},
  {tag:"white", ref:"Rule 7.2.2 / 7.4.1", t:"A gipszeket és protéziseket mérkőzés előtt meg kell mutatni. Általában veszélyes ékszer: egyszerű sima gyűrűn kívül minden gyűrű; nem orvosi órák és fém/kemény műanyag karkötők; nyakláncok (kivéve a ruha alá tűrt, leragasztott vallási medál); karika- és lógó fülbevalók, nagy arcgyűrűk; ajak- és szemöldökpiercing, hegyes arcpiercing."}
 ],

CH.push({
 id:4, icon:"⏱️", title:"Időzítés és pontozás", rules:"4. rész – 8–11. szabály",
 intro:"Hány perc, hány szett, mikor jön a Final set, hány pont jár. Itt az EDF a legtöbb gyakorlati részletet tisztázza.",
 points:[
  {ref:"8", h:"Játékstílus", t:"A játékstílust a labda típusa határozza meg; ez a szabálykönyv a <b>Cloth</b> stílusra szól."},
  {ref:"9.1", h:"Mérkőzés hossza", t:"Két egyenlő <b>20 perces félidő</b>, köztük <b>5 perc</b> szünet. A félidő végén térfelet cserélnek. Ha nem tudnak megegyezni az oldalválasztásban, pénzfeldobás dönt."},
  {ref:"9.2", h:"Szett", t:"A mérkőzés határozatlan számú szettből áll. Egy szett legfeljebb <b>3 perces</b>, nyitó rohammal kezdődik. Vége: lejár az idő, vagy az egyik csapat minden játékosa kiesett. Szettek között <b>30 másodperc</b> az előkészület; aki nem kész, szóbeli figyelmeztetést vagy csapat sárga lapot kaphat."},
  {ref:"9.4–9.5", h:"Mérkőzés- és szettóra", t:"A mérkőzésóra a félidő első szettjével indul, és csak akkor áll meg, ha (1) a szett véget ért és a hátralévő idő miatt Final set jön, vagy (2) a játékvezető felfüggeszti a játékot. A szettóra a szett elején indul, és csak felfüggesztéskor áll meg."},
  {ref:"9.6", h:"Final set", t:"Ha egy szett úgy ér véget, hogy a mérkőzésórán <b>120 másodpercnél kevesebb</b> van hátra, Final set következik: <b>90 másodperc</b>. Hibás rajtnál a 90 másodperc újraindul. A félidő a Final set végével ér véget. Ha 120 másodpercnél több, de 3 percnél kevesebb van hátra, a játékvezető „Short set” felszólítást mond."},
  {ref:"9.7", h:"Döntő szett (tie-breaking set)", t:"Ha a mérkőzés nem végződhet döntetlennel, <b>3 perces</b> döntő szett jön. Ha ez sem hoz győztest: <b>„sudden death”</b> – az nyer, aki először kiejt egy játékost. Az oldalválasztást itt is pénzfeldobás dönti, ha nem egyeznek meg."},
  {ref:"9.8", h:"Időkérés", t:"Félidőnként <b>1 időkérés</b>, <b>60 másodperc</b>. Csak jogosult csapatvezető kérheti a szett vége után, mielőtt a játékvezető sorba hívja a csapatokat. Időkérés alatt a mérkőzés áll."},
  {ref:"9.9–9.10", h:"Felfüggesztés és újraindítás (reset)", t:"A játékvezetők bármikor felfüggeszthetik a játékot; ekkor minden óra áll, mindenki a kijelölt helyén marad, a semleges zónában lévő, senki által nem kontrollált labdák a helyükön maradnak. A játék <b>resettel</b> folytatódik: minden élő játékosnak egy lába a hátsó vonalon. Amikor az első játékos a támadóvonalon átlép, a nem teljesen a pályán lévők kiesnek. A csapatok a saját térfelükön (a semleges zóna kivételével) bármilyen labdát felvehetnek."},
  {ref:"10", h:"Pontozás", t:"<b>Szettgyőzelem: 2 pont</b>; <b>döntetlen szett: 1 pont</b>; vereség: 0. Szettet nyer, aki az ellenfél összes játékosát kiejti, vagy aki az idő lejártakor több élő/belépő játékossal rendelkezik. Döntetlen szett: egyenlő számú élő/belépő játékos az idő végén, vagy egyidejű játék után egyik csapatnak sincs élő/belépő játékosa. A mérkőzést a legtöbb pontot szerző csapat nyeri; ha mindkettőnek ugyanannyi van, döntetlen (de ha a versenyszabály győztest kíván, döntő szett jön)."},
  {ref:"11", h:"Lemondás (forfeit)", t:"Szett lemondásakor a szett azonnal véget ér, az ellenfél nyer. Mérkőzés lemondásakor a mérkőzés azonnal véget ér. Ha egy csapat nem jelenik meg a kezdésre, szettet veszít, és még <b>3 percet</b> vár rá a játékvezető; ha nem lesz kész, a mérkőzést is elveszíti."}
 ],
 edf:[
  {tag:"white", ref:"Rule 9.2.2", t:"Ha egy normál szett 3 percnél kevesebbel a mérkőzésóra vége előtt indul, a maximális hossza a félidőből hátralévő időre csökken."},
  {tag:"white", ref:"Rule 9.2.3", t:"A szett (és a szettóra) a <b>sípszóval</b> kezdődik, nem az indítási eljárással."},
  {tag:"orange", ref:"Rule 9.2.4", t:"A szettidő lejárta és a szett végét jelző jel közötti események még a szetthez tartoznak. Ha az eltelt idő <b>5 másodpercnél</b> hosszabb, az reklamáció alapja."},
  {tag:"white", ref:"Rule 9.2.5", t:"A csapat akkor „kész”, ha a szabályos létszámú aktív játékos a helyén van. A játékvezetők úgy indítják az eljárást, hogy a szett kezdősípja a 30. másodpercben szólaljon meg. Ha a „Team ready” kimondásakor valaki nem kész, a 30. másodpercnél felfüggesztik a mérkőzést, és figyelmeztetnek vagy büntetnek."},
  {tag:"white", ref:"Rule 9.2.5", t:"Szettek között legfeljebb 30 másodpercet kell várni (a félidő első szettje előtt és időkérés után néhány másodperccel több is megengedett). A sorrend: <b>1. vétség figyelmeztetés, 2. csapat sárga, 3. végső figyelmeztetés, 4. második csapat sárga</b>."},
  {tag:"white", ref:"Rule 9.3.1", t:"A félidő kezdetekor a sorba állás elmulasztása hasonlóan időhúzásnak számít; a játékvezetők a szettek közöttinél korábban hívják a „Line up”-ot."},
  {tag:"yellow", ref:"Rule 9.8", t:"Időkérés módja: a csapatvezető vagy a kapitány felhívja a fő játékvezetők figyelmét, T jelet mutat kezével/karjával és/vagy kimondja: „Timeout”."},
  {tag:"white", ref:"Rule 9.8", t:"Időkérés után a 30 másodpercből hátralévő idő <b>nem</b> folytatódik; a mérkőzésóra a következő szett kezdetével indul újra."},
  {tag:"white", ref:"Rule 9.8.1", t:"Második időkérés ugyanabban a félidőben: figyelmeztetés, további kérések csapat sárgával büntethetők. Ha az időkérést tévesen adták meg, sípszóval és „Line up” felszólítással azonnal le kell zárni, az órát úgy kell beállítani, mintha 30 másodperc telt volna el, és figyelmeztetés vagy sárga lap jár."},
  {tag:"yellow", ref:"Rule 9.8.3", t:"Ha nem csapatvezető vagy kapitány kér időt, nem kell megadni, tájékoztatni kell, ki jogosult rá. A „Line up” után érkező kérés figyelmen kívül marad. A „Line up”-ot a szett indítása előtt kb. 5 másodperccel kell kiadni."},
  {tag:"white", ref:"Rule 9.9", t:"A felfüggesztést jelző síp után történt kiesések és elkapások érvénytelenek. A játékvezetők kerüljék a felfüggesztést, ha a pályán akció van; ha a labdát éppen a síp pillanatában dobták el, visszaadhatják a dobónak."},
  {tag:"white", ref:"Rule 9.9.3", t:"Felfüggesztés alatt az élő játékosok kérésre elhagyhatják a pályát; ha nem teszik, figyelmeztetést kapnak, ragaszkodás esetén kék lapot. A pályán tartózkodó, nem élő játékosokra ugyanez vonatkozik. A pályán lévő csapatvezetők figyelmeztetést, ismétlés esetén csapat sárga lapot kapnak."},
  {tag:"white", ref:"Rule 9.10.1", t:"Ha valakinek a folytatáskor nincs lába a hátsó vonalon: „Backline” felszólítás, majd figyelmeztetés, végül csapat sárga. Nem kell büntetni, ha közel van a vonalhoz, és nem ejt ki ellenfelet a támadóvonal átlépésével; ha kiejt, kék lap jár."},
  {tag:"yellow", ref:"Rule 10.2.1 (2) / 10.3.1", t:"Az a távozó játékos, aki elkapás miatt visszatérhet, de még a sor felé tart, beleszámít az élő/belépő létszámba."},
  {tag:"white", ref:"Rule 11.3", t:"A 3 perces várakozás alatt a mérkőzésóra jár (az első félidő akár 3 perccel rövidülhet). Ha a késést a rendezvény menetrendje okozta, a csapatot nem szabad büntetni. Ha mindkét csapat késik, az óra a kezdési időpontban elindul; ha az első félidő végéig senki nem jelenik meg, a mérkőzés döntetlen."},
  {tag:"white", ref:"Egyedi eset", t:"Ha a szett 3 percnél kevesebbel a félidő vége előtt indul, és az utolsó élő játékost éppen a szett vége előtt találják el, a labdát még nem kapta el, és megszólal a síp, a szett a maximális idő lejártával ért véget, és <b>nem lesz Final set</b>. Hasonlóan: ha a szett 5 perccel a vége előtt indul, a következő szett lesz a Final set."}
 ],

CH.push({
 id:12, icon:"🟨", title:"Büntetések és lapok", rules:"5. rész, 8. szakasz – 32–36. szabály",
 intro:"A kék, sárga és piros lap rendszere, a csapatlapok és a magatartási kódex. Itt a legfontosabb megkülönböztetni a lap hatását a játékosra és a csapatra.",
 points:[
  {ref:"32", h:"Általános", t:"A büntetőterületre küldött játékosnak ott kell maradnia a büntetés idejére. Aktív játékos marad, a csapat nem cserélheti le (sérülés kivételével). Letöltés után a sor <b>végére</b> áll vissza; ha a büntetés szettek között telik le, a következő szettben teljes jogú játékos. A játékvezetők <b>szóbeli figyelmeztetést</b> adhatnak. Ha egy csapat vagy annak résztvevői összesen <b>4 sárga lapot</b> kapnak a mérkőzésen, a csapat elveszíti a mérkőzést (<b>1 piros = 2 sárga</b>). A sportszerűtlenség már attól a pillanattól büntethető, hogy a csapatok beléptek a játékterületre."},
  {ref:"33", h:"Kék lap", t:"A játékos büntetőterületre kerül az aktuális szett hátralévő részére <b>és a teljes következő szettre</b>. A csapat hiányos létszámmal játszik. Egy játékos mérkőzésenként csak <b>kétszer</b> kaphat kék lapot, a további vétség sárga lapot jelent. Ha a csapat nem tud legalább 1 játékost a büntetőterületre küldeni, a jelenlegi (ha szett közben kapta) és a következő szettet elveszíti; ha mindkét csapat így jár, a szett(ek) döntetlenek."},
  {ref:"34", h:"Sárga lap", t:"<b>Játékos:</b> azonnal a büntetőterületre, <b>5 perc</b> mérkőzésidőre. Egy játékos csak <b>egyszer</b> kaphat sárgát a mérkőzésen, a következő már piros. <b>Labdaszedő:</b> ha a labdaszedő nem játékos, 5 percre elhagyja a játékteret, és egy játékos 5 percre a büntetőterületre megy (a csapat választja ki, szettek között cserélhet); ha a labdaszedő játékos, úgy kell eljárni, mintha játékos kapott volna sárgát, és egy aktív játékos helyettesíti. <b>Csapat:</b> szett közben a csapat elveszíti az aktuális szettet; szettek között vagy a mérkőzés végén (aláírás előtt) egy teljes szettet. Csapat sárga lapot egyszer lehet kapni, azután piros."},
  {ref:"35", h:"Piros lap", t:"<b>Játékos:</b> azonnal kizárják a mérkőzésből, és a csapat a mérkőzés hátralévő részében hiányos létszámmal játszik. <b>Csapat:</b> elveszíti a mérkőzést."},
  {ref:"36", h:"Magatartási kódex", t:"Mindenki őszintén és tisztességesen köteles betartani a szabályokat; vétség esetén élő játékosnál kiesés, indokolt esetben figyelmeztetés vagy büntetés jár. Büntethető többek között: verekedés/testi sértés; diszkriminatív megjegyzés; gúnyolódás, ellenfél „kiesettnek” kiáltása; labda dobása a már egyértelműen kiesett ellenfélre; szándékos fájdalomokozás vagy túl erős dobás közelről az arcra; túlzott káromkodás; csalás; a pályán lévők zavarása; felszerelés rongálása (rúgás, földhöz vágás); indokolatlan időhúzás; tisztességtelen előny szerzése; sportszerűtlen viselkedés."}

function fmt(html){
  var m, lead="", items=null, t=html;
  var lab=t.match(/<b>[^<]{1,80}:<\/b>/g);
  if(lab&&lab.length>=2){
    var parts=t.split(/(?=<b>[^<]{1,80}:<\/b>)/);
    if(/^\s*<b>/.test(parts[0])){ lead=""; items=parts; } else { lead=parts[0].trim(); items=parts.slice(1); }
  } else if(/\(1\)/.test(t)&&/\(2\)/.test(t)){
    var ps=t.split(/\s*(?=\(\d{1,2}\)\s)/);
    lead=ps[0].trim(); items=ps.slice(1);
  } else {
    var sp=t.replace(/\s+/g," ").split(/(?<=[.!?](?:<\/b>)?)\s+(?=[A-ZÁÉÍÓÖŐÚÜŰ„<(])/);
    var ok=sp.filter(function(x){return x.trim();});
    if(ok.length>=3&&!/^\s*<(ul|ol|table)/.test(t)){ items=ok; }
  }
  if(!items||items.length<2) return t;
  return (lead?"<p>"+lead+"</p>":"")+"<ul class=\"lst\">"+items.map(function(x){return "<li>"+x.trim()+"</li>";}).join("")+"</ul>";
}

/* ---------- kvíz motor ---------- */
function realize(q){
  var vs=[{q:q.q,o:q.o,a:q.a}].concat(q.alt||[]);
  var s=load(), last=s.lastv[q.id], pick;
  var cand=vs.map(function(_,i){return i;});
  if(vs.length>1&&last!=null) cand=cand.filter(function(i){return i!==last;});
  pick=cand[Math.floor(Math.random()*cand.length)];
  s.lastv[q.id]=pick;
  var v=vs[pick], idx=shuffle(v.o.map(function(_,i){return i;}));
  return {q:v.q,o:idx.map(function(i){return v.o[i];}),a:idx.indexOf(v.a),e:q.e,r:q.r,ch:q.ch};
}
function pointsFor(ms){ var rem=Math.max(0,TIME*1000-ms)/(TIME*1000); return Math.max(POINTS_MIN,Math.round(POINTS_MAX*rem)); }

function runQuiz(cfg){
  var qs=cfg.questions.map(realize); save();
  var i=0, score=0, pts=0, wrong=[], answered=false, t0=0, tickId=null, tmoId=null, log=[];
  function stopTimer(){ if(tickId){clearInterval(tickId);tickId=null;} if(tmoId){clearTimeout(tmoId);tmoId=null;} }
  function render(){
    var q=qs[i], out=[];
    out.push(h("div",{class:"crumbs"},[h("a",{href:cfg.crumb[0],text:"← "+cfg.crumb[1]})]));
    out.push(h("div",{class:"row"},[h("strong",{text:cfg.title}),h("span",{class:"muted",text:(i+1)+" / "+qs.length+(cfg.race?" · "+pts+" pont":"")})]));
    out.push(h("div",{class:"bar",style:"margin:8px 0 10px"},[h("i",{style:"width:"+pct(i,qs.length)+"%"})]));
    var tsec=h("span",{class:"tsec",text:String(TIME)});
    var tfill=h("i",{style:"width:100%"});
    out.push(h("div",{class:"timer",role:"timer","aria-label":"Hátralévő idő"},[h("span",{text:"⏱ "}),tsec,h("span",{text:" mp"}),h("div",{class:"tbar"},[tfill])]));
    out.push(h("div",{class:"q",id:"qtxt",text:q.q}));
    var opts=h("div",{class:"opts",role:"group","aria-labelledby":"qtxt"});
    var fb=h("div",{"aria-live":"polite"});
    answered=false;
    q.o.forEach(function(t,k){
      opts.appendChild(h("button",{class:"opt",type:"button",onclick:function(){choose(k);}},[h("span",{class:"k",text:String.fromCharCode(65+k)}),h("span",{text:t})]));
    });
    function lock(chosen){
      Array.prototype.forEach.call(opts.children,function(b,j){
        b.disabled=true;
        if(j===q.a) b.classList.add("good"); else if(j===chosen) b.classList.add("bad");
      });
    }
    function nextBtn(){
      var nb=h("button",{class:"btn",id:"nextbtn",text:i<qs.length-1?"Következő kérdés →":"Eredmény megtekintése",onclick:next});
      fb.appendChild(nb); try{nb.focus();}catch(e){}
    }
    function choose(k){
      if(answered) return; answered=true; stopTimer();
      var ms=now()-t0, ok=k===q.a, gained=0;
      if(ok){ score++; if(cfg.race){ gained=pointsFor(ms); pts+=gained; } } else wrong.push({q:q,chosen:k});
      lock(k);
      fb.appendChild(h("div",{class:"fb "+(ok?"good":"bad")},[
        h("strong",{text:ok?"✔ Helyes! ":"✘ Nem ez a helyes. "}),
        cfg.race&&ok?h("strong",{text:"+"+gained+" pont ("+(ms/1000).toFixed(1)+" mp) "}):null,
        h("span",{text:q.e}),
        q.r?h("div",{class:"muted",style:"margin-top:4px",text:"Hivatkozás: "+q.r}):null
      ]));
      nextBtn();
    }
    function expire(){
      if(answered) return; answered=true; stopTimer();
      wrong.push({q:q,chosen:-1});
      lock(-1);
      tsec.textContent="0"; tfill.style.width="0%";
      fb.appendChild(h("div",{class:"fb bad"},[
        h("strong",{text:"⏱ Lejárt az idő. "}),
        h("span",{text:q.e}),
        q.r?h("div",{class:"muted",style:"margin-top:4px",text:"Hivatkozás: "+q.r}):null
      ]));
      nextBtn();
    }
    function next(){ if(i<qs.length-1){ i++; render(); } else finish(); }
    out.push(opts); out.push(fb);
    show(out);
    t0=now();
    tickId=setInterval(function(){
      var el=now()-t0, rem=Math.max(0,TIME*1000-el);
      tsec.textContent=String(Math.ceil(rem/1000));
      tfill.style.width=(100*rem/(TIME*1000))+"%";
      tfill.className=rem<=5000?"crit":(rem<=10000?"low":"");
      if(rem<=0) expire();
    },100);
    timers.push(tickId);
    document.onkeydown=function(ev){
      if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
      var key=String(ev.key).toLowerCase();
      if(!answered){ var n=({"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3})[key]; if(n!=null&&n<q.o.length) choose(n); }
      else if(key==="enter"){ var nb=$("#nextbtn"); if(nb&&document.activeElement!==nb) nb.click(); }
    };
  }
  function finish(){
    clearTimers();
    var p=pct(score,qs.length), pass=p>=PASS;
    if(cfg.onDone) cfg.onDone(score,qs.length,pts,pass);
    lastResult=function(){ drawResult(p,pass); };
    nav("/result");
  }
  function drawResult(p,pass){
    var out=[];
    out.push(h("div",{class:"crumbs"},[h("a",{href:cfg.crumb[0],text:"← "+cfg.crumb[1]})]));
    out.push(h("h1",{text:cfg.title+" – eredmény"}));
    var box=cfg.race?h("div",{class:"card"},[
      h("div",{class:"score",text:pts+" pont"}),
      h("p",{style:"font-size:20px;font-weight:650;margin:6px 0 0",text:score+" / "+qs.length+" helyes · "+p+"%"})
    ]):h("div",{class:"card"},[
      h("div",{class:"score",text:p+"%"}),
      h("p",{text:score+" helyes válasz "+qs.length+" kérdésből. "+(pass?"Elfogadva (≥"+PASS+"%) – szép munka! 🎉":"Nem érte el az elfogadási küszöböt ("+PASS+"%). Nézd át az alábbi hibákat, és próbáld újra.")})
    ]);
    out.push(box);
    if(cfg.breakdown) out.push(cfg.breakdown(qs,wrong));
    if(cfg.after) cfg.after(out,pts,pass);
    var ex=(cfg.extraBtns?cfg.extraBtns(pass):[]);
    var pri=null, rest=[];
    ex.forEach(function(x){ if(!pri&&x.getAttribute("data-primary")) pri=x; else rest.push(x); });
    var again=ab(pri?"":"pri","🔁 Újra",{onclick:cfg.again});
    var sec=pri?[again].concat(rest):rest;
    var pairs=[]; for(var i=0;i<sec.length;i+=2) pairs.push([sec[i],sec[i+1]]);
    pairs.push([ab("","🏠 Menü",{href:"#/"})]);
    out.push(actbar(pri||again,pairs));
    if(wrong.length){
      out.push(h("h2",{text:"Átnézendő kérdések ("+wrong.length+")"}));
      wrong.forEach(function(w){
        out.push(h("div",{class:"miss"},[
          h("div",{style:"font-weight:650",text:w.q.q}),
          h("div",{class:"muted",text:"A te válaszod: "+(w.chosen<0?"nem válaszoltál (lejárt az idő)":w.q.o[w.chosen])}),
          h("div",{text:"Helyes: "+w.q.o[w.q.a]}),
          h("div",{class:"muted",text:w.q.e+(w.q.r?" ("+w.q.r+")":"")})
        ]));
      });
    }
    show(out);
  }
  render();
}

function buildSet(){
  var pool=[];
  CH.forEach(function(c){ c.quiz.forEach(function(q){ pool.push(q); }); });
  var chosen=[];
  CH.forEach(function(c){ shuffle(pool.filter(function(q){return q.ch===c.id;})).slice(0,2).forEach(function(q){chosen.push(q);}); });
  var rest=shuffle(pool.filter(function(q){return chosen.indexOf(q)<0;}));
  while(chosen.length<FINAL_N&&rest.length) chosen.push(rest.shift());
  return shuffle(chosen);
}
function breakdown(qs,wrong){
  var by={}; qs.forEach(function(q){ var k=q.ch||0; by[k]=by[k]||{t:0,w:0}; by[k].t++; });

    var c=chap(+k), r=by[k];

    var remote=(s.board&&s.board.rows)||[], ids={};
    remote.forEach(function(r){ ids[r.id]=1; });
    rows=remote.concat((s.outbox||[]).filter(function(r){ return !ids[r.id]; }));
  } else rows=s.race.slice();
  var best={};
  rows.forEach(function(r){ var k=String(r.n).toLowerCase(); if(!best[k]||r.p>best[k].p) best[k]=r; });
  return Object.keys(best).map(function(k){return best[k];}).sort(function(a,b){ return b.p-a.p || String(a.d).localeCompare(String(b.d)); });
}
function fmtDate(d){
  d=String(d||"");
  var m=d.match(/^(\d{4})\.(\d{2})\.(\d{2})\./);
  if(m) return m[1]+"."+m[2]+"."+m[3]+".";
  var t=new Date(d);
  if(isNaN(t.getTime())) return "";
  return t.getFullYear()+"."+("0"+(t.getMonth()+1)).slice(-2)+"."+("0"+t.getDate()).slice(-2)+".";
}
function renderBoard(host,noTitle){
  var s=load(), rows=boardRows(), me=(s.name||"").toLowerCase();
  host.textContent="";
  if(!noTitle||!boardOn()) host.appendChild(h("h2",{text:boardOn()?"Ranglista":"Ranglista (ezen az eszközön)"}));
  if(boardOn()){
    var pend=(s.outbox||[]).length, msg;
    if(pend) msg=pend+" eredményed elküldésre vár, amint van internet, magától elküldi az app.";
    else if(s.board&&s.board.at) msg="Utoljára frissítve: "+s.board.at+(navigator.onLine===false?" (offline, a legutóbbi mentett lista látszik)":".");
    else msg=navigator.onLine===false?"Offline vagy, a közös lista még nem érhető el.":"A közös lista betöltése…";
    host.appendChild(h("p",{class:"muted",text:msg}));
  }
  if(!rows.length){ host.appendChild(h("p",{class:"muted",text:"Még nincs eredmény a ranglistán."})); return; }
  var tb=h("table",{class:"lb"},[h("tr",{},[h("th",{text:"#"}),h("th",{text:"Név"}),h("th",{text:"Eredmény"}),h("th",{class:"p",text:"Pont"})])]);
  rows.forEach(function(r,i){
    var nm=h("td",{class:"nm"},[h("span",{class:"who",text:r.n}),h("span",{class:"dt",text:fmtDate(r.d)})]);
    var tr=h("tr",{},[h("td",{class:"n",text:(i===0?"🏆 ":"")+(i+1)+"."}),nm,h("td",{class:"s",text:r.c+"/"+r.t+" · "+pct(r.c,r.t)+"%"}),h("td",{class:"p",text:String(r.p)})]);
    if(me&&String(r.n).toLowerCase()===me) tr.className="me";
    tb.appendChild(tr);
  });
  host.appendChild(tb);
}
function renderRank(){
  if(!rankHost||!rankInfo||!document.body.contains(rankHost)) return;
  var rows=boardRows(), i=-1, nm=rankInfo.name.toLowerCase();
  rows.forEach(function(r,k){ if(i<0&&String(r.n).toLowerCase()===nm) i=k; });
  rankHost.textContent=i>=0?"Helyezésed a ranglistán: "+(i+1)+". ("+rows.length+" résztvevő közül)":"";
}
function refreshBoardView(){
  if(boardHost&&document.body.contains(boardHost)) renderBoard(boardHost,!!boardHost.getAttribute("data-nt"));
  renderRank();
}
function syncBoard(){
  if(!boardOn()||boardBusy||navigator.onLine===false) return;
  boardBusy=true;
  var box=(load().outbox||[]).slice();
  Promise.all(box.map(function(r){
    return fetch(BOARD_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(r)}).catch(function(){});
  })).then(function(){ return fetch(BOARD_URL+(BOARD_URL.indexOf("?")<0?"?":"&")+"t="+Date.now()); })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(j&&j.rows){
      var s=load(), ids={}; j.rows.forEach(function(r){ ids[r.id]=1; });
      s.board={rows:j.rows,at:stamp()};
      s.outbox=(s.outbox||[]).filter(function(r){ return !ids[r.id]; });
      save();
    }
    boardBusy=false; refreshBoardView();
  }).catch(function(){ boardBusy=false; refreshBoardView(); });
}

function startRace(name){
  runQuiz({
    title:"Verseny – "+name, crumb:["#/race","Verseny"], questions:buildSet(), race:true, again:function(){startRace(name);}, breakdown:breakdown,
    onDone:function(score,total,pts){
      var s=load(), e={id:newId(),n:name,p:pts,c:score,t:total,d:stamp()};
      s.race.push(e); s.race=s.race.sort(function(a,b){return b.p-a.p;}).slice(0,30);
      if(boardOn()){ s.outbox=(s.outbox||[]).concat([e]); }
      save(); syncBoard();
    },
    after:function(out,pts){
      rankHost=h("p",{class:"muted"}); rankInfo={name:name}; out.push(rankHost); renderRank();

    },

  });
}

function viewBank(){
  var out=[], total=0, vtotal=0;
  CH.forEach(function(c){ c.quiz.forEach(function(q){ total++; vtotal+=1+(q.alt||[]).length; }); });
  out.push(h("div",{class:"crumbs"},[h("a",{href:"#/",text:"← Főoldal"})]));
  out.push(h("h1",{text:"📋 Kérdésbázis"}));

  var box=h("input",{class:"search",type:"search",placeholder:"Szűrés (kérdés vagy válasz szövege)…","aria-label":"Szűrés"});
  out.push(box);
  var wrap=h("div",{});

  function draw(){
    var f=box.value.trim().toLowerCase(); wrap.innerHTML="";
    CH.forEach(function(c){
      var items=[];
      c.quiz.forEach(function(q,i){
        var vs=[q].concat(q.alt||[]);
        var txt=vs.map(function(v){return v.q+" "+v.o.join(" ");}).join(" ").toLowerCase();
